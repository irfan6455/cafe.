<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caffe zipoor - daftar menu pembeli</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Icon Keranjang & Tombol -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header class="header">
        <div class="header-content">
            <h1>Cafe zipoor 🏫</h1>
            <p id="tableInfo" class="table-badge">Memuat Nomor Meja...</p>
        </div>
    </header>

    <!-- KONTEN UTAMA: DAFTAR MENU -->
    <main class="container">
        <!-- Bilah Pencarian & Filter Kategori -->
        <div class="filter-section">
            <input type="text" id="searchInput" placeholder="Cari makanan atau minuman...">
            <div class="categories">
                <button class="cat-btn active" data-category="all">Semua</button>
                <button class="cat-btn" data-category="makanan">Makanan</button>
                <button class="cat-btn" data-category="minuman">Minuman</button>
                <button class="cat-btn" data-category="snack">Snack</button>
            </div>
        </div>

        <!-- Grid Daftar Menu -->
        <div id="menuGrid" class="menu-grid">
            <!-- Data Menu akan dirender secara dinamis lewat JavaScript -->
        </div>
    </main>

    <!-- FLOATING CART BUTTON (Tombol Keranjang Mengambang) -->
    <div id="cartBar" class="cart-bar hidden">
        <div class="cart-info">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0 item</span> | <span id="cartTotal">Rp 0</span>
        </div>
        <button id="btnOpenCart" class="btn-checkout-trigger">Lihat Pesanan</button>
    </div>

    <!-- MODAL KERANJANG & CHECKOUT -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span id="btnCloseCart" class="close-button">&times;</span>
            <h2>pesanan yang anda pilih</h2>
            
            <div id="cartItemsList" class="cart-items-container">
                <!-- Item di keranjang akan muncul di sini -->
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span>estimjasi pembayaran:</span>
                    <strong id="modalTotal">Rp 0</strong>
                </div>
            </div>

            <button id="btnConfirmOrder" class="btn btn-primary">kirim Pesanan</button>
        </div>
    </div>

    <!-- SCRIPT JS -->
    <script src="script.js"></script>
</body>
</html>
